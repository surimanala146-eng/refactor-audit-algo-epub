[project]
name = "matrice-v2-oneshot"
version = "0.3.0"
description = "Matrice algorithmique v2 — livres en entrée, manifest + fiches en sortie, en une seule commande."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
formats = ["ebooklib>=0.18", "beautifulsoup4>=4.12", "pymupdf>=1.24"]
yaml = ["PyYAML>=6.0"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
matrice = "orchestration.__main__:main"

[tool.setuptools]
packages = ["domain", "ingestion", "extraction", "retrieval", "taxonomy", "orchestration", "webapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
